<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>李沿睿 Yanrui Li · 战略传播与内容营销</title>
  <meta name="description" content="李沿睿 Yanrui Li — 战略传播、公关与内容营销。阿德莱德大学传播学硕士在读。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%233a4bff'/%3E%3Ctext x='50' y='67' font-size='48' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3EY%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <div class="nav__inner">
      <a href="#home" class="brand" aria-label="Yanrui Li">
        <span class="brand__mark">Y</span>
        <span class="brand__name">Yanrui Li</span>
      </a>
      <nav class="nav__links" id="navLinks">
        <a href="#about" data-i18n="nav.about"></a>
        <a href="#experience" data-i18n="nav.experience"></a>
        <a href="#projects" data-i18n="nav.projects"></a>
        <a href="#skills" data-i18n="nav.skills"></a>
        <a href="#contact" data-i18n="nav.contact"></a>
      </nav>
      <div class="nav__tools">
        <button class="icon-btn lang-btn" id="langBtn" data-i18n-aria="a11y.lang"><span class="lang-btn__zh">中</span><span class="lang-btn__sep">/</span><span class="lang-btn__en">EN</span></button>
        <button class="icon-btn" id="themeBtn" data-i18n-aria="a11y.theme">
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></svg>
        </button>
        <a class="btn btn--sm btn--solid hide-sm" id="navResume" download data-i18n="nav.resume"></a>
        <button class="icon-btn menu-btn" id="menuBtn" data-i18n-aria="a11y.menu"><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section class="hero" id="home" data-section>
      <div class="hero__spot" id="spot" aria-hidden="true"></div>
      <div class="container hero__grid">
        <div class="hero__copy">
          <p class="status"><i></i><span data-i18n="hero.status"></span></p>
          <h1 class="hero__title">
            <span class="hero__hello" data-i18n="hero.hello"></span>
            <span class="hero__name" data-i18n="hero.name"></span>
          </h1>
          <p class="hero__lead" data-i18n="hero.lead"></p>
          <p class="hero__focus"><span data-i18n="hero.focus"></span> <span class="rotator" id="rotator" aria-live="polite"></span></p>
          <div class="hero__cta">
            <a href="#projects" class="btn btn--solid magnetic"><span data-i18n="hero.ctaProjects"></span> <span aria-hidden="true">→</span></a>
            <a href="#contact" class="btn btn--ghost magnetic" data-i18n="hero.ctaContact"></a>
          </div>
        </div>
        <div class="hero__card tilt" id="heroCard">
          <div class="idc">
            <div class="idc__top">
              <span class="idc__avatar">YL</span>
              <div>
                <p class="idc__name">Yanrui Li · 李沿睿</p>
                <p class="idc__role mono">STRATEGIC COMMUNICATION</p>
              </div>
            </div>
            <ul class="idc__stats" id="heroStats"></ul>
          </div>
        </div>
      </div>
      <a href="#about" class="scroll-cue" aria-label="scroll"><span data-i18n="hero.scroll"></span><i></i></a>
    </section>

    <!-- ABOUT -->
    <section class="section" id="about" data-section>
      <div class="container">
        <header class="sec-head reveal">
          <p class="kicker"><span class="kicker__no">01</span><span data-i18n="about.kicker"></span></p>
          <h2 data-i18n="about.title"></h2>
        </header>
        <div class="about">
          <div class="about__text reveal" id="aboutText"></div>
          <div class="about__edu reveal">
            <h3 class="sub-title" data-i18n="about.educationTitle"></h3>
            <div id="eduList"></div>
          </div>
        </div>
        <h3 class="sub-title reveal" data-i18n="about.bringTitle"></h3>
        <div class="bring" id="bringList"></div>
      </div>
    </section>

    <!-- EXPERIENCE -->
    <section class="section section--alt" id="experience" data-section>
      <div class="container">
        <header class="sec-head reveal">
          <p class="kicker"><span class="kicker__no">02</span><span data-i18n="exp.kicker"></span></p>
          <h2 data-i18n="exp.title"></h2>
        </header>
        <div class="filters reveal" role="tablist" id="expFilters" aria-describedby="expHint">
          <span class="filters__hint" id="expHint" data-i18n="exp.filterHint"></span>
        </div>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <!-- PROJECTS -->
    <section class="section" id="projects" data-section>
      <div class="container">
        <header class="sec-head reveal">
          <p class="kicker"><span class="kicker__no">03</span><span data-i18n="proj.kicker"></span></p>
          <h2 data-i18n="proj.title"></h2>
        </header>
        <div class="filters reveal" role="tablist" id="projFilters"></div>
        <div class="projects" id="projectGrid"></div>
      </div>
    </section>

    <!-- SKILLS -->
    <section class="section section--alt" id="skills" data-section>
      <div class="container">
        <header class="sec-head reveal">
          <p class="kicker"><span class="kicker__no">04</span><span data-i18n="skills.kicker"></span></p>
          <h2 data-i18n="skills.title"></h2>
        </header>
        <div class="skillmap reveal">
          <div class="skillmap__groups" id="skillGroups"></div>
          <aside class="evidence" id="evidence" aria-live="polite">
            <p class="evidence__title mono" data-i18n="skills.evidenceTitle"></p>
            <div class="evidence__body" id="evidenceBody"></div>
          </aside>
        </div>
        <div class="tools reveal">
          <h3 class="sub-title" data-i18n="skills.toolsTitle"></h3>
          <div class="tools__row" id="toolsRow"></div>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section" id="contact" data-section>
      <div class="container">
        <header class="sec-head reveal">
          <p class="kicker"><span class="kicker__no">05</span><span data-i18n="contact.kicker"></span></p>
          <h2 data-i18n="contact.title"></h2>
          <p class="sec-head__lead" data-i18n="contact.lead"></p>
        </header>
        <div class="contact">
          <div class="contact__cards reveal" id="contactCards"></div>
          <form class="form reveal" id="contactForm" novalidate>
            <h3 class="sub-title" data-i18n="contact.formTitle"></h3>
            <label class="field"><span data-i18n="contact.formName"></span><input name="name" autocomplete="name" required /></label>
            <label class="field"><span data-i18n="contact.formOrg"></span><input name="org" autocomplete="organization" /></label>
            <fieldset class="field">
              <legend data-i18n="contact.formTopic"></legend>
              <div class="seg" id="topicSeg"></div>
            </fieldset>
            <label class="field"><span data-i18n="contact.formMsg"></span><textarea name="msg" rows="4" required></textarea></label>
            <button class="btn btn--solid btn--block magnetic" type="submit"><span data-i18n="contact.formSend"></span> <span aria-hidden="true">↗</span></button>
            <p class="form__note" data-i18n="contact.formNote"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>© 2026 Yanrui Li · <span data-i18n="footer.made"></span></span>
      <a href="#home" data-i18n="footer.top"></a>
    </div>
  </footer>

  <dialog class="modal" id="modal" aria-labelledby="modalTitle">
    <div class="modal__inner" id="modalInner"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
